version: 2
# Private @zuplo/* packages on npm.pkg.github.com need no `registries` entry:
# Dependabot reads GitHub Packages with its own GITHUB_TOKEN once each package
# grants this repository read access (Package settings > Manage Actions
# access).

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      eslint-dependencies:
        patterns:
          - "*eslint*"
      prettier-dependencies:
        patterns:
          - "*prettier*"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      eslint-dependencies:
        patterns:
          - "*eslint*"
      prettier-dependencies:
        patterns:
          - "*prettier*"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      eslint-dependencies:
        patterns:
          - "*eslint*"
      prettier-dependencies:
        patterns:
          - "*prettier*"

  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    allow:
      - dependency-type: "production"
